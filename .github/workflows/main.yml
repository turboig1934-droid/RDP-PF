name: RDP

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Hours'
        type: number
        default: 6

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 43200

    steps:
      # ============================================
      # SYSTEM INFO
      # ============================================
      - name: System Info
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "SYSTEM SPECIFICATIONS"
          Write-Host "========================================="
          $cpu = Get-WmiObject -Class Win32_Processor
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Cores: $($cpu.NumberOfCores)"
          $ram = [math]::Round((Get-WmiObject Win32_ComputerSystem).TotalPhysicalMemory/1GB, 2)
          Write-Host "RAM: $ram GB"
          $disk = Get-WmiObject -Class Win32_LogicalDisk -Filter "DeviceID='C:'"
          Write-Host "Free Disk: $([math]::Round($disk.FreeSpace/1GB, 2)) GB"
          Write-Host "========================================="

      # ============================================
      # ENABLE RDP
      # ============================================
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          powercfg -change -standby-timeout-ac 0
          Restart-Service -Name TermService -Force
          Write-Host "RDP Enabled"

      # ============================================
      # CREATE USER
      # ============================================
      - name: Create User
        shell: pwsh
        run: |
          $password = "Admin@123#" + (Get-Random -Maximum 999)
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Admin" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Admin"
          echo "USER=Admin" >> $env:GITHUB_ENV
          echo "PASS=$password" >> $env:GITHUB_ENV
          Write-Host "User Created"

      # ============================================
      # INSTALL CHOCOLATEY
      # ============================================
      - name: Install Chocolatey
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          Write-Host "Chocolatey Installed"

      # ============================================
      # INSTALL TOOLS (Optional)
      # ============================================
      - name: Install Tools
        shell: pwsh
        run: |
          choco install vscode git python googlechrome 7zip -y
          Write-Host "Tools Installed"

      # ============================================
      # INSTALL TAILSCALE
      # ============================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          Remove-Item $installer -Force
          Write-Host "Tailscale Installed"

      # ============================================
      # CONNECT TAILSCALE
      # ============================================
      - name: Connect Tailscale
        shell: pwsh
        run: |
          $AUTH_KEY = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if ([string]::IsNullOrEmpty($AUTH_KEY)) {
            Write-Host "ERROR: TAILSCALE_AUTH_KEY not set!"
            Write-Host "Add it in: Settings → Secrets → New secret"
            exit 1
          }
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          & $tailscale up --authkey=$AUTH_KEY --hostname=rdp-server --accept-routes
          Start-Sleep -Seconds 10
          $ip = & $tailscale ip -4
          echo "IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Connected! IP: $ip"

      # ============================================
      # SHOW INFO
      # ============================================
      - name: Connection Info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "RDP CONNECTION INFO"
          Write-Host "========================================="
          Write-Host "IP: $env:IP"
          Write-Host "User: Admin"
          Write-Host "Password: $env:PASS"
          Write-Host ""
          Write-Host "Connect using Remote Desktop"
          Write-Host "========================================="

      # ============================================
      # KEEP ALIVE
      # ============================================
      - name: Keep Alive
        shell: pwsh
        run: |
          $endTime = (Get-Date).AddHours(${{ github.event.inputs.duration }})
          while ((Get-Date) -lt $endTime) {
            Write-Host "RDP Active - IP: $env:IP - Time: $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
