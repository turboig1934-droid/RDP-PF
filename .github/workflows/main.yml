name: 🔥 SIMPLE RDP - Fast Setup

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Hours to keep running'
        type: number
        default: 6

jobs:
  simple-rdp:
    runs-on: windows-latest
    timeout-minutes: 43200

    steps:
      # ============================================
      # STEP 1: SYSTEM INFO
      # ============================================
      - name: System Info
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "⚡ SIMPLE RDP SYSTEM"
          Write-Host "========================================="
          
          $cpu = Get-WmiObject -Class Win32_Processor
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Cores: $($cpu.NumberOfCores)"
          
          $ramGB = [math]::Round((Get-WmiObject Win32_ComputerSystem).TotalPhysicalMemory/1GB, 2)
          Write-Host "RAM: $ramGB GB"
          
          $disk = Get-WmiObject -Class Win32_LogicalDisk -Filter "DeviceID='C:'"
          $freeGB = [math]::Round($disk.FreeSpace / 1GB, 2)
          Write-Host "Free Disk: $freeGB GB"
          Write-Host "========================================="

      # ============================================
      # STEP 2: ENABLE RDP
      # ============================================
      - name: Enable RDP
        shell: pwsh
        run: |
          Write-Host "Enabling RDP..."
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          
          Restart-Service -Name TermService -Force
          Write-Host "RDP Enabled"

      # ============================================
      # STEP 3: CREATE USER
      # ============================================
      - name: Create User
        shell: pwsh
        run: |
          Write-Host "Creating User..."
          
          $charSet = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+'
          $password = -join ((1..16) | ForEach { Get-Random -Maximum $charSet.Length | ForEach-Object { $charSet[$_] } })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (Get-LocalUser -Name "User" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "User" -Force
          }
          
          New-LocalUser -Name "User" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "User"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "User"
          
          echo "RDP_USER=User" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          
          Write-Host "User Created"

      # ============================================
      # STEP 4: INSTALL TAILSCALE
      # ============================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Installing Tailscale..."
          
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          Remove-Item $installer -Force
          
          Write-Host "Tailscale Installed"

      # ============================================
      # STEP 5: CONNECT TAILSCALE
      # ============================================
      - name: Connect Tailscale
        shell: pwsh
        run: |
          Write-Host "Connecting to Tailscale..."
          
          $AUTH_KEY = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          
          if ([string]::IsNullOrEmpty($AUTH_KEY)) {
            Write-Host "❌ ERROR: TAILSCALE_AUTH_KEY not set!"
            Write-Host ""
            Write-Host "Add secret: Settings → Secrets → TAILSCALE_AUTH_KEY"
            Write-Host ""
            exit 1
          }
          
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          
          & $tailscale up --authkey=$AUTH_KEY --hostname=simple-rdp --accept-routes --accept-dns
          
          $ip = $null
          $retries = 0
          while (-not $ip -and $retries -lt 20) {
            Start-Sleep -Seconds 3
            $ip = & $tailscale ip -4 2>$null
            $retries++
          }
          
          if ($ip) {
            echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
            Write-Host "Connected! IP: $ip"
          } else {
            Write-Host "Failed to get IP"
            & $tailscale status
            exit 1
          }

      # ============================================
      # STEP 6: SHOW CONNECTION INFO
      # ============================================
      - name: Connection Info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "🔥 SIMPLE RDP - CONNECTION INFO"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "📡 IP: $env:TAILSCALE_IP"
          Write-Host "👤 User: User"
          Write-Host "🔑 Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "========================================="
          Write-Host "HOW TO CONNECT:"
          Write-Host "========================================="
          Write-Host "1. Install Tailscale on your PC"
          Write-Host "2. Remote Desktop → Computer: $env:TAILSCALE_IP"
          Write-Host "3. Username: User"
          Write-Host "4. Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "⚡ SYSTEM:"
          Write-Host "   CPU: $(Get-WmiObject Win32_Processor).Name"
          Write-Host "   RAM: $([math]::Round((Get-WmiObject Win32_ComputerSystem).TotalPhysicalMemory/1GB, 2)) GB"
          Write-Host "========================================="

      # ============================================
      # STEP 7: KEEP ALIVE
      # ============================================
      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "Keeping RDP alive for ${{ github.event.inputs.duration }} hours..."
          
          $endTime = (Get-Date).AddHours(${{ github.event.inputs.duration }})
          $count = 0
          
          while ((Get-Date) -lt $endTime) {
            $count++
            Write-Host "[$count] 🔥 RDP Active - IP: $env:TAILSCALE_IP"
            Write-Host "    ⏱️ Time: $(Get-Date -Format 'HH:mm:ss')"
            Write-Host "    Press Ctrl+C to stop"
            Start-Sleep -Seconds 300
          }
