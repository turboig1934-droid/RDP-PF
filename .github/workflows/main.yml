name: 🔥 ULTRA HEAVY RDP - Full Power

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Hours to keep running'
        type: number
        default: 6
      install_heavy_tools:
        description: 'Install heavy tools (VS, Docker, Python, Node, etc.)'
        type: boolean
        default: true

jobs:
  ultra-heavy-rdp:
    runs-on: windows-latest
    timeout-minutes: 43200

    steps:
      # ============================================
      # STEP 1: SYSTEM INFO
      # ============================================
      - name: System Information
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "⚡ ULTRA HEAVY SYSTEM SPECIFICATIONS"
          Write-Host "========================================="
          
          $cpu = Get-WmiObject -Class Win32_Processor
          Write-Host "🖥️ CPU: $($cpu.Name)"
          Write-Host "   Cores: $($cpu.NumberOfCores)"
          
          $ramGB = [math]::Round((Get-WmiObject Win32_ComputerSystem).TotalPhysicalMemory/1GB, 2)
          Write-Host "📊 RAM: $ramGB GB"
          
          $disk = Get-WmiObject -Class Win32_LogicalDisk -Filter "DeviceID='C:'"
          $freeGB = [math]::Round($disk.FreeSpace / 1GB, 2)
          Write-Host "💾 Free Disk: $freeGB GB"
          
          Write-Host "========================================="

      # ============================================
      # STEP 2: ENABLE RDP
      # ============================================
      - name: Enable RDP
        shell: pwsh
        run: |
          Write-Host "🔧 Configuring Ultra Heavy RDP..."
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Ultra" 2>$null
          netsh advfirewall firewall add rule name="RDP-Ultra" dir=in action=allow protocol=TCP localport=3389
          
          powercfg -change -standby-timeout-ac 0
          powercfg -change -hibernate-timeout-ac 0
          
          Restart-Service -Name TermService -Force
          Write-Host "✅ Ultra RDP Configured!"

      # ============================================
      # STEP 3: CREATE USER - FIXED (No System.Web)
      # ============================================
      - name: Create Ultra User
        shell: pwsh
        run: |
          Write-Host "👤 Creating Ultra User..."
          
          # ✅ FIX: Simple password generator (no System.Web required)
          $charSet = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+'
          $password = -join ((1..20) | ForEach { Get-Random -Maximum $charSet.Length | ForEach-Object { $charSet[$_] } })
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (Get-LocalUser -Name "UltraUser" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "UltraUser" -Force
          }
          
          New-LocalUser -Name "UltraUser" -Password $securePass -AccountNeverExpires -FullName "Ultra Heavy User"
          Add-LocalGroupMember -Group "Administrators" -Member "UltraUser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "UltraUser"
          
          echo "RDP_USER=UltraUser" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          
          Write-Host "✅ Ultra User created"

      # ============================================
      # STEP 4: INSTALL CHOCOLATEY
      # ============================================
      - name: Install Chocolatey
        shell: pwsh
        run: |
          Write-Host "📦 Installing Chocolatey..."
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          Write-Host "✅ Chocolatey installed"

      # ============================================
      # STEP 5: INSTALL HEAVY TOOLS
      # ============================================
      - name: Install Heavy Tools
        if: github.event.inputs.install_heavy_tools == 'true'
        shell: pwsh
        run: |
          Write-Host "📦 Installing Heavy Tools..."
          
          # Development
          choco install vscode git python nodejs openjdk21 -y
          
          # Database
          choco install mysql postgresql mongodb -y
          
          # Networking
          choco install wireshark nmap putty filezilla -y
          
          # Media
          choco install ffmpeg vlc -y
          
          # System
          choco install cpu-z gpu-z everything -y
          
          Write-Host "✅ Heavy Tools installed!"

      # ============================================
      # STEP 6: INSTALL TAILSCALE
      # ============================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "📥 Installing Tailscale..."
          
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          Remove-Item $installer -Force
          
          Write-Host "✅ Tailscale installed"

      # ============================================
      # STEP 7: CONNECT TAILSCALE
      # ============================================
      - name: Connect Tailscale
        shell: pwsh
        run: |
          Write-Host "🔗 Connecting to Tailscale..."
          
          $AUTH_KEY = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          
          if ([string]::IsNullOrEmpty($AUTH_KEY)) {
            Write-Host "❌ ERROR: TAILSCALE_AUTH_KEY is not set in GitHub Secrets!"
            Write-Host ""
            Write-Host "📝 How to fix:"
            Write-Host "1. Go to https://login.tailscale.com/admin/settings/keys"
            Write-Host "2. Generate a new auth key (Reusable + Ephemeral)"
            Write-Host "3. Add it as a GitHub Secret:"
            Write-Host "   Settings → Secrets → New secret"
            Write-Host "   Name: TAILSCALE_AUTH_KEY"
            Write-Host "   Value: tskey-auth-xxxxx"
            Write-Host ""
            exit 1
          }
          
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          
          & $tailscale up --authkey=$AUTH_KEY --hostname=ultra-heavy-rdp --accept-routes --accept-dns
          
          $ip = $null
          $retries = 0
          while (-not $ip -and $retries -lt 20) {
            Start-Sleep -Seconds 3
            $ip = & $tailscale ip -4 2>$null
            $retries++
          }
          
          if ($ip) {
            echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
            Write-Host "✅ Connected! IP: $ip"
          } else {
            Write-Host "❌ Failed to get IP"
            & $tailscale status
            exit 1
          }

      # ============================================
      # STEP 8: SHOW CONNECTION INFO
      # ============================================
      - name: Show Connection Info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "🔥 ULTRA HEAVY RDP - CONNECTION INFO"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "📡 TAILSCALE IP: $env:TAILSCALE_IP"
          Write-Host "👤 USERNAME: UltraUser"
          Write-Host "🔑 PASSWORD: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "========================================="
          Write-Host "📝 HOW TO CONNECT:"
          Write-Host "========================================="
          Write-Host "1. Install Tailscale on your PC"
          Write-Host "2. Open Remote Desktop Connection"
          Write-Host "3. Computer: $env:TAILSCALE_IP"
          Write-Host "4. Username: UltraUser"
          Write-Host "5. Password: $env:RDP_PASSWORD"
          Write-Host "========================================="

      # ============================================
      # STEP 9: KEEP ALIVE
      # ============================================
      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "🔄 Keeping ULTRA HEAVY runner alive..."
          
          $endTime = (Get-Date).AddHours(${{ github.event.inputs.duration }})
          $count = 0
          
          while ((Get-Date) -lt $endTime) {
            $count++
            Write-Host "[$count] 🔥 ULTRA HEAVY RDP ACTIVE"
            Write-Host "   📡 IP: $env:TAILSCALE_IP"
            Write-Host "   ⏱️ Time: $(Get-Date -Format 'HH:mm:ss')"
            Write-Host "   💤 Press Ctrl+C to stop"
            Start-Sleep -Seconds 60
          }
