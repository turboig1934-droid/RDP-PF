name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 43200

    steps:
      - name: System Info
        run: |
          systeminfo | findstr /C:"OS Name"
          systeminfo | findstr /C:"Total Physical Memory"
          wmic cpu get name
          wmic logicaldisk where "DeviceID='C:'" get Size,FreeSpace

      - name: Enable RDP
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          wmic path win32_computersystem where name="%COMPUTERNAME%" set AutomaticManagedPagefile=True
          powercfg -change -standby-timeout-ac 0

      - name: Create User
        run: |
          net user admin P@ssw0rd123! /add
          net localgroup administrators admin /add
          net localgroup "Remote Desktop Users" admin /add
          echo "Username: admin"
          echo "Password: P@ssw0rd123!"

      - name: Install Tailscale
        run: |
          curl -L -o tailscale.msi https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi
          msiexec /i tailscale.msi /quiet /norestart
          del tailscale.msi

      - name: Connect Tailscale
        run: |
          "%ProgramFiles%\Tailscale\tailscale.exe" up --authkey=%TAILSCALE_AUTH_KEY% --hostname=rdp
          for /f "tokens=*" %%i in ('"%ProgramFiles%\Tailscale\tailscale.exe" ip -4') do set IP=%%i
          echo IP=%IP%

      - name: Show Info
        run: |
          echo =========================================
          echo RDP CONNECTION INFO
          echo =========================================
          echo IP Address: %IP%
          echo Username: admin
          echo Password: P@ssw0rd123!
          echo =========================================

      - name: Keep Alive
        run: |
          for /L %%i in (1,1,1440) do (
            echo RDP Active - %date% %time%
            timeout /t 60 /nobreak >nul
          )
